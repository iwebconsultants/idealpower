name: Build and Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:
    # Allows triggering the workflow manually from the Admin Dashboard

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build the App
        run: npm run build

      - name: Verify Build Output
        run: ls -R dist

      - name: Save Service Account Key Safely
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IDEALPOWER_SYDNEY }}
        shell: python
        run: |
          import os, json
          key_str = os.environ.get('FIREBASE_KEY', '').strip()
          try:
              # Validate and re-format JSON to ensure it is clean
              key_data = json.loads(key_str)
              with open('firebase-key.json', 'w') as f:
                  json.dump(key_data, f)
              print("Successfully saved sanitized service account key.")
          except Exception as e:
              print(f"FAILED TO PARSE FIREBASE KEY JSON: {e}")
              # Write it as-is if it's not valid JSON to let the next step fail with a clearer error
              with open('firebase-key.json', 'w') as f:
                  f.write(key_str)

      - name: Deploy to Firebase Hosting Live
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IDEALPOWER_SYDNEY }}
          channelId: live
          projectId: idealpower-sydney
