name: Build and Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:
    # Allows triggering the workflow manually from the Admin Dashboard

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build the App (Runs fetch-content.js automatically)
        run: npm run build

      - name: Deploy to Firebase Hosting on PR
        if: ${{ github.event_name == 'pull_request' }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IDEALPOWER_SYDNEY }}
          projectId: idealpower-sydney

      - name: Deploy to Firebase Hosting Live
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        run: |
          set -x
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_IDEALPOWER_SYDNEY }}' > firebase-key.json
          export GOOGLE_APPLICATION_CREDENTIALS=$(pwd)/firebase-key.json
          npx firebase-tools deploy --only hosting --site idealpower-sydney --project idealpower-sydney --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/firebase-key.json
